name: psychosims
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  convert: ^3.1.1
  crypto: ^3.0.3
  cryptography: 2.9.0
  flutter_secure_storage: 11.0.0
  url_launcher: 6.3.2
  app_links: 6.4.1
  ffi: ^2.1.0
  get: ^4.6.6
  path: ^1.8.0
  path_provider: ^2.1.2
  psyconfig:
    path: ../config
  psychemas:
    path: ../packages/psychemas
  psycore:
    path: ../packages/psycore

dev_dependencies:
  ffigen: ^10.0.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - ../content/manifests/poc_sample.json
    - assets/licenses/QWEN2.5_LICENSE
    - assets/licenses/PHI3.5_LICENSE
    - assets/licenses/SMOLLM2_LICENSE
